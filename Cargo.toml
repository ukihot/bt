[package]
name = "bt"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
