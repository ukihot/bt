[package]
name = "bt"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "*", features = ["dynamic_linking"] }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
rand = "0.10"
# Bevy 0.19's Parley text backend pulls in ICU4X without its bundled Japanese/Chinese
# segmentation dictionary. Without the "logging" feature, icu_provider falls back to raw
# `eprintln!` in debug builds whenever it hits that gap, spamming stderr on every text
# layout. Enabling "logging" here (feature-unified across the whole dependency graph)
# routes it through the `log` crate instead, so the LogPlugin filter in main.rs can
# silence it.
icu_provider = { version = "2.2", features = ["logging"] }

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
